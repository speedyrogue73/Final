{% extends 'base.html' %}

{% block title %}بازیابی رمز عبور | Bookeat{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="surface-card p-4 p-lg-5">
        <h1 class="h4 fw-bold mb-2">بازیابی رمز عبور</h1>
        <p class="text-muted small mb-4">ایمیل ثبت‌شده در حساب کاربری خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label fw-semibold">ایمیل</label>
            <input type="email" name="email" id="id_email" class="form-control" dir="ltr" required>
          </div>
          <button type="submit" class="btn btn-ketabino w-100">ارسال لینک بازیابی</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
